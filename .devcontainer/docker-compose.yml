name: hub-sistemas-ifrs

services:
  backend:
    build:
      context: ..
      dockerfile: .devcontainer/backend.Dockerfile
    working_dir: /workspace/backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file: ../backend/.env
    environment:
      ENVIRONMENT: "dev"
    volumes:
      - ..:/workspace:cached
    expose:
      - "8000"
    networks:
      ifrs-dev-network:
        aliases:
          - hub-backend
          - hub-sistemas-backend

  frontend:
    image: node:20-alpine
    working_dir: /workspace/frontend
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 3000"
    env_file: ../frontend/.env
    volumes:
      - ..:/workspace:cached
      - hub_node_modules:/workspace/frontend/node_modules
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      ifrs-dev-network:
        aliases:
          - hub-frontend
          - hub-sistemas-frontend

volumes:
  hub_node_modules:

networks:
  ifrs-dev-network:
    external: true
