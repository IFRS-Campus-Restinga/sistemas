name: hub-sistemas-ifrs

services:
  backend:
    build:
      context: ..
      dockerfile: .devcontainer/backend.Dockerfile
    working_dir: /workspace/backend
    env_file:
      - path: ../backend/.env
        format: raw
    environment:
      ENVIRONMENT: "dev"
      RUNSERVER_HOST: "0.0.0.0"
      RUNSERVER_RELOAD: "true"
    volumes:
      - ..:/workspace:cached
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/')\" 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s
    networks:
      ifrs-dev-network:
        aliases:
          - hub-backend
          - hub-sistemas-backend

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    working_dir: /workspace/frontend
    env_file:
      - path: ../frontend/.env
        format: raw
    volumes:
      - ..:/workspace:cached
      - hub_node_modules:/workspace/frontend/node_modules
    command: >-
      sh -c "if [ ! -x node_modules/.bin/vite ]; then npm ci --no-audit --no-fund; fi
      && exec npx vite --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      ifrs-dev-network:
        aliases:
          - hub-frontend
          - hub-sistemas-frontend

volumes:
  hub_node_modules:

networks:
  ifrs-dev-network:
    external: true
